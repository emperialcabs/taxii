name: Build iOS IPA (iPhone App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Build & Package Taxigo.ipa
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -derivedDataPath build -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r Taxigo.ipa Payload

      - name: Upload Taxigo.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxigo-iOS-IPA
          path: ios/App/build/Taxigo.ipa
